version: "3.9"

services:
  quote-websocket:
    build:
      context: .
      dockerfile: Dockerfile.websocket
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}"
        PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST:-mirrors.aliyun.com}"
    image: akshare-quote-websocket:dev
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      QUOTE_PROVIDER: "${QUOTE_PROVIDER:-default}"
      QUOTE_POLL_INTERVAL: "${QUOTE_POLL_INTERVAL:-3.0}"
      QUOTE_LOG_LEVEL: "${QUOTE_LOG_LEVEL:-INFO}"
      FUTU_OPEND_HOST: "${FUTU_OPEND_HOST:-host.docker.internal}"
      FUTU_OPEND_PORT: "${FUTU_OPEND_PORT:-11111}"
      IFIND_ACCESS_TOKEN: "${IFIND_ACCESS_TOKEN:-}"
      IFIND_REFRESH_TOKEN: "${IFIND_REFRESH_TOKEN:-}"
      IFIND_REQUEST_TIMEOUT: "${IFIND_REQUEST_TIMEOUT:-10}"
      IFIND_SKIP_OFF_HOURS_REQUESTS: "${IFIND_SKIP_OFF_HOURS_REQUESTS:-1}"
    ports:
      - "${QUOTE_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

